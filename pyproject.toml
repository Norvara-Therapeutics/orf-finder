[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nv-orf-finder"
version = "1.1.3rc3"
description = "Six-frame ORF scanning and nucleic-acid metrics with no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
maintainers = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
keywords = ["bioinformatics", "orf", "fasta", "translation", "sequence-analysis"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Norvara-Therapeutics/orf-finder"
Repository = "https://github.com/Norvara-Therapeutics/orf-finder.git"
Issues = "https://github.com/Norvara-Therapeutics/orf-finder/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
orf-finder = "orf_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
